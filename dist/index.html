<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101614"><meta name="description" content="绝密航天清图后的理包模拟器。搜索容器、整理胸挂背包、保护安全箱物资，满载撤离。"><title>绝密航天 · 理包模拟器</title><link rel="stylesheet" href="style.css?v=20261022-drag2"></head><body>
<div class="app-shell">
<header class="topbar"><div class="character-tabs"><span class="tab-key">Q</span><span class="active">角色 <small>CHARACTER</small></span><span class="inactive">航天基地 <b>绝密</b></span><span class="tab-key">E</span></div><span class="build-label">清图理包模拟器 · 非官方</span><div class="top-actions"><button id="sound" class="icon-button" title="开启声音" aria-label="开启声音">◖))</button><button id="settings" class="icon-button" title="设置" aria-label="设置">⚙</button><button id="help" class="ghost">操作说明 <kbd>?</kbd></button><div class="session-time"><span>理包用时</span><strong id="timer">00:00</strong></div><button id="extract" class="extract-button">撤离结算 ↗</button></div></header>
<nav class="mobile-tabs" aria-label="物资分区"><button data-mobile-view="equipment">角色装备</button><button data-mobile-view="inventory">随身物资</button><button data-mobile-view="loot" class="active">战利品</button></nav>
<main class="workspace">
<aside class="equipment"><div class="operator-stage"><img class="operator-portrait" src="assets/operator.png" alt="身着战术装备的干员角色插画"><div class="operator-vignette"></div><div class="operator-location"><span class="status-dot"></span> 区域已肃清 <small>黑室周边 / 航天基地</small></div></div><div id="equipment-slots"></div><div class="operator-stats"><div class="stat-row"><span>▣ 负重</span><b id="weight">0 / 80 kg</b></div><div class="weight-track"><i id="weight-fill"></i></div><div class="health"><span class="operator-id">G.T.I. 干员</span><b>100 <small>/ 100</small></b></div><div class="health-bar"><i></i></div><span id="round-id" class="mission-id"></span></div><button id="new-round" class="ghost new-round">↻ 再清一图</button></aside>
<section class="inventory panel"><div class="match-summary"><div><span class="match-label">▤ 本局物资总值</span><strong id="total-value">0</strong></div><button id="sort" class="text-button">▦ 整理</button></div><div class="inventory-scroll"><div id="player-rig"></div><div id="player-pockets"></div><div id="player-bag"></div></div><div id="player-safe" class="fixed-safe"></div><div class="inventory-bottom"><span>◇ 安全箱内物资受保护</span><span id="capacity"></span></div></section>
<section class="loot panel"><div class="loot-title"><h2>战利品 <small>LOOT</small></h2><span class="count" id="source-count"></span></div><div id="source-tabs" class="source-tabs"></div><div class="source-heading"><div><h3 id="source-name">干员物资</h3><span id="source-location"></span></div><button id="search-toggle" class="search-button"><i class="mini-spinner"></i><span>搜索中</span></button></div><div class="search-track"><i id="search-fill"></i></div><div id="loot-content" class="loot-scroll"></div><div class="loot-bottom"><span id="search-description">逐件搜索</span><button id="take-all" class="text-button">拾取已搜索物资 →</button></div></section>
</main><footer class="bottom-bar"><div class="profit"><span>新增带出估值</span><strong id="profit">+ 0</strong><small>固定参考价格</small><span class="search-stat">已搜索 <b id="searched">0 / 0</b></span></div><div class="keyboard-guide"><span><kbd>Ctrl</kbd> 快捷转移</span><span><kbd>双击</kbd> 拾取</span><span><kbd>R</kbd> 旋转</span><span><kbd>Esc</kbd> 取消</span><button id="fullscreen" class="text-button">⛶ 全屏</button></div></footer>
</div><div id="toast" role="status" aria-live="polite"></div><div id="item-menu" class="item-menu" hidden></div><div id="drag-ghost" hidden></div><div id="modal-root"></div><div id="mobile-hint" hidden><button id="dismiss-mobile">知道了</button></div>
<script type="module" src="app.js?v=20261022-drag2"></script></body></html>
